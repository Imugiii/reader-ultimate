name: Build/Release

# Déclenchement sur :
# - Tags de version (vX.Y.Z)
# - Workflow manuel
# - Push sur master (pour builds de test)
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type de version (patch/minor/major)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # Job de validation avant le build
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint || echo "Linter not configured"

      - name: Run tests
        run: yarn test --ci --coverage --watchAll=false || echo "Tests not configured"

      - name: Check version format
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+(\.[0-9]+)?)?$ ]]; then
            echo "❌ Error: Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z or X.Y.Z-prerelease.N"
            exit 1
          fi
          echo "✅ Version format is valid: $VERSION"

      - name: Check if tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Error: Tag version ($TAG_VERSION) doesn't match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches package.json"

  # Job de build pour toutes les plateformes
  release:
    needs: validate
    runs-on: ${{ matrix.os }}

    # Plateformes à construire
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest, ubuntu-24.04-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v1.2.0
        if: startsWith(matrix.os, 'ubuntu-22.04')
        with:
          snapcraft_token: ${{ secrets.snapcraft_token }}

      - name: Install Gcc
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: |
          sudo apt update
          sudo apt-get install gcc-multilib g++-multilib

      - name: Install FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          sudo apt update
          sudo apt-get install -y ruby-full build-essential zlib1g-dev liblzma-dev
          sudo gem install --no-document fpm

      - name: Prepare for app notarization (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p ~/private_keys/
          echo ${{ github.ref }}
          echo '${{ secrets.API_KEY }}' > ~/private_keys/AuthKey_${{ secrets.API_KEY_ID }}.p8
          brew install python-setuptools

      - name: Set environment variable USE_SYSTEM_FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: echo "USE_SYSTEM_FPM=true" >> $GITHUB_ENV

      - name: Set environment variable USE_HARD_LINKS
        run: echo "USE_HARD_LINKS=false" >> $GITHUB_ENV

      - name: Modify package.json for Linux arm64 build
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          jq '.build.linux.target = [
            {
              "target": "deb",
              "arch": ["arm64"]
            },
            {
              "target": "AppImage", 
              "arch": ["arm64"]
            }
          ]' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Build React app
        run: yarn prerelease

      - name: Build/Release Electron app
        uses: samuelmeuli/action-electron-builder@v1.6.0
        with:
          build_script_name: "release"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mac_certs: ${{ secrets.MAC_CERTS }}
          mac_certs_password: ${{ secrets.MAC_CERTS_PASSWORD }}
          # Release uniquement si c'est un tag de version
          release: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-devtest') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc') }}
        env:
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.API_KEY_ISSUER_ID }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/
          if-no-files-found: ignore

  # Job pour créer/éditer la release GitHub
  create-release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-devtest') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc')
    needs: [validate, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from tag
        id: tag_version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG_VERSION"

      - name: Generate release notes
        id: release_notes
        run: |
          # Extraire les notes depuis CHANGELOG.md
          VERSION=${{ steps.tag_version.outputs.version }}
          # Cette partie devrait extraire la section correspondante du CHANGELOG
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Version $VERSION" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Voir [CHANGELOG.md](CHANGELOG.md) pour les détails complets." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Version ${{ steps.tag_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false

